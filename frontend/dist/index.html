      if (window.location.hostname.includes('vercel.app')) {
        window.location.replace('https://gebatrh-production.up.railway.app' + window.location.pathname + window.location.search + window.location.hash);
      }

      // Force unregister all service workers and clear cache storage to prevent stale bundles
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('Gebat RH: Service Worker dé-enregistré pour nettoyer le cache');
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) caches.delete(name);
        });
      }
    </script>
