    <script>
      // Force unregister all service workers to clear potential cache issues from previous projects
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('SIRH: Service Worker dé-enregistré pour nettoyer le cache');
          }
        });
      }
    </script>
