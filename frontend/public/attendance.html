<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borne de Pointage - Gebat RH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ci: {
                            green: '#2563EB',
                            orange: '#E5A110',
                            text: '#2d3436',
                            muted: '#636e72',
                            bg: '#f0f2f5',
                            border: '#dfe6e9',
                            danger: '#d63031'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .terminal-bg { background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%); }
        .num-pad button:active { transform: scale(0.9); background: #2d3436; }
        .glow-green { box-shadow: 0 0 20px rgba(37, 99, 235, 0.3); }
        .glow-orange { box-shadow: 0 0 20px rgba(229, 161, 16, 0.3); }
        .bg-gradient-ci { background: linear-gradient(135deg, #2563EB 0%, #E5A110 100%); }
    </style>
</head>
<body class="terminal-bg min-h-screen flex items-center justify-center p-4 overflow-hidden">
    <div class="max-w-4xl w-full grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
        <div class="text-center lg:text-left space-y-8">
            <div class="inline-flex items-center gap-4">
                <div class="bg-white p-2 rounded-3xl shadow-2xl border-2 border-[#E5A110] flex items-center justify-center shrink-0">
                    <img src="/gebat_logo.png" alt="GEBAT Logo" class="h-12 object-contain" />
                </div>
                <div>
                    <h1 class="text-4xl font-black text-white tracking-tighter flex items-center gap-2">GEBAT <span class="text-[#E5A110]">RH</span></h1>
                    <p class="text-[#2563EB] font-bold tracking-[0.3em] uppercase text-xs">Terminal Borne de Pointage</p>
                </div>
            </div>
            <div class="space-y-2">
                <div id="currentTime" class="text-7xl md:text-9xl font-black text-white tracking-tighter tabular-nums">00:00</div>
                <div id="currentSeconds" class="text-2xl font-bold text-ci-green/50 tabular-nums">00</div>
                <div id="currentDate" class="text-xl font-medium text-white/40 uppercase tracking-widest pt-4">—</div>
            </div>
            <div class="hidden lg:block pt-12">
                <p class="text-white/20 text-xs font-bold uppercase tracking-widest flex items-center gap-2">
                    <i data-lucide="map-pin" class="w-4 h-4"></i> Terminal Sécurisé - Zone : Abidjan Plateau
                </p>
            </div>
        </div>

        <div class="bg-white rounded-[36px] shadow-2xl p-6 lg:p-8 relative overflow-hidden">
            <!-- Fullscreen Feedback Overlay -->
            <div id="kioskOverlay" class="absolute inset-0 z-50 rounded-[36px] flex flex-col items-center justify-center text-white p-6 text-center hidden transition-all duration-300">
                <div id="overlayIconContainer" class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mb-4">
                    <i id="overlayIcon" data-lucide="check" class="w-10 h-10"></i>
                </div>
                <h3 id="overlayTitle" class="text-2xl font-black mb-1 uppercase tracking-wide">MERCI !</h3>
                <p id="userNameLabel" class="text-lg font-bold opacity-90 max-w-sm">—</p>
                <p id="actionLabel" class="mt-3 px-5 py-1.5 bg-white/20 rounded-full text-xs font-black tracking-widest uppercase">Entrée enregistrée</p>
            </div>

            <div class="space-y-4">
                <div class="text-center space-y-0.5">
                    <h2 class="text-xl font-black text-[#2d3436]">IDENTIFICATION</h2>
                    <p class="text-[#636e72] text-[11px] font-medium">Saisissez votre matricule (ex: 001 ou 002)</p>
                </div>

                <div class="relative">
                    <input type="text" id="matriculeDisplay" readonly placeholder="--- --- ---" class="w-full text-center py-3 bg-[#f0f2f5] border-none rounded-2xl text-2xl font-black tracking-[0.2em] text-[#2d3436] placeholder:text-[#dfe6e9]">
                </div>

                <!-- Instant Live Employee Preview Card -->
                <div id="empPreviewCard" class="hidden bg-[#f0f2f5] border border-[#dfe6e9] rounded-2xl p-3 transition-all duration-300">
                    <div class="flex items-center gap-3">
                        <div id="empAvatar" class="w-10 h-10 rounded-xl bg-[#009E49] text-white font-black flex items-center justify-center text-xs shadow-md uppercase">
                            --
                        </div>
                        <div class="flex-1 text-left min-w-0">
                            <h4 id="empName" class="font-black text-[#2d3436] text-xs truncate">...</h4>
                            <p id="empRole" class="text-[9px] font-bold text-[#636e72] uppercase truncate">...</p>
                        </div>
                        <div id="empStatusBadge" class="text-[9px] font-black uppercase px-2.5 py-1 rounded-lg shrink-0">
                            ...
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3 num-pad" id="numPad"></div>

                <div class="grid grid-cols-2 gap-4 pt-2">
                    <button id="btnIn" onclick="processPointage('IN')" class="group flex flex-col items-center gap-2 p-4 bg-white border-2 border-[#009E49] rounded-2xl hover:bg-[#009E49] transition-all shadow-md shadow-[#009E49]/15 active:scale-95">
                        <i data-lucide="log-in" class="w-6 h-6 text-[#009E49] group-hover:text-white transition-colors"></i>
                        <span class="font-black text-[#009E49] group-hover:text-white uppercase tracking-widest text-[11px]">ARRIVÉE</span>
                    </button>
                    <button id="btnOut" onclick="processPointage('OUT')" class="group flex flex-col items-center gap-2 p-4 bg-white border-2 border-[#F77F00] rounded-2xl hover:bg-[#F77F00] transition-all shadow-md shadow-[#F77F00]/15 active:scale-95">
                        <i data-lucide="log-out" class="w-6 h-6 text-[#F77F00] group-hover:text-white transition-colors"></i>
                        <span class="font-black text-[#F77F00] group-hover:text-white uppercase tracking-widest text-[11px]">DÉPART</span>
                    </button>
                </div>
            </div>

            <!-- Live Scrolling Ticker Feed -->
            <div class="mt-4 p-2.5 bg-[#f0f2f5] rounded-xl border border-[#dfe6e9] flex items-center gap-2.5">
                <span class="w-2 h-2 rounded-full bg-[#009E49] animate-pulse shrink-0"></span>
                <span class="text-[9px] font-black uppercase tracking-widest text-[#009E49] shrink-0">EN DIRECT :</span>
                <div class="overflow-hidden whitespace-nowrap w-full">
                    <span id="liveTickerText" class="text-xs font-bold text-[#2d3436] inline-block">Chargement des derniers pointages...</span>
                </div>
            </div>

            <div class="mt-4 text-center">
                <a href="/login" class="text-xs font-bold text-[#636e72] hover:text-[#2d3436] transition-colors inline-flex items-center justify-center gap-2">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> QUITTER LE TERMINAL
                </a>
            </div>
        </div>
    </div>

    <script>
        let currentInput = "";
        let isProcessing = false;
        let lookupTimer = null;

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'tap') {
                    osc.frequency.value = 580;
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.06);
                } else if (type === 'success') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(160, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                }
            } catch(e) {}
        }

        function buildNumPad() {
            const pad = document.getElementById('numPad');
            pad.innerHTML = '';
            [1,2,3,4,5,6,7,8,9].forEach(n => {
                const btn = document.createElement('button');
                btn.className = 'py-3.5 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl text-xl font-black shadow transition-all active:scale-95 border border-slate-800';
                btn.textContent = n;
                btn.onclick = () => tapNum(String(n));
                pad.appendChild(btn);
            });

            const clearBtn = document.createElement('button');
            clearBtn.className = 'py-3.5 bg-rose-900/40 text-rose-300 hover:bg-rose-900/60 rounded-2xl text-xs font-black uppercase tracking-wider border border-rose-900/50 transition-all active:scale-95';
            clearBtn.textContent = 'EFFACER';
            clearBtn.onclick = tapClear;
            pad.appendChild(clearBtn);

            const zeroBtn = document.createElement('button');
            zeroBtn.className = 'py-3.5 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl text-xl font-black shadow transition-all active:scale-95 border border-slate-800';
            zeroBtn.textContent = '0';
            zeroBtn.onclick = () => tapNum('0');
            pad.appendChild(zeroBtn);

            const delBtn = document.createElement('button');
            delBtn.className = 'py-3.5 bg-slate-800 text-slate-300 hover:bg-slate-700 rounded-2xl text-xs font-black uppercase tracking-wider border border-slate-700 transition-all active:scale-95';
            delBtn.textContent = 'EFFACER 1';
            delBtn.onclick = tapDelete;
            pad.appendChild(delBtn);

            lucide.createIcons();
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('currentTime').innerText = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }).replace(':', ' : ');
            document.getElementById('currentSeconds').innerText = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('currentDate').innerText = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();
        buildNumPad();

        function tapNum(n) {
            playSound('tap');
            if (currentInput.length < 8) {
                currentInput += n;
                updateDisplay();
            }
        }
        function tapClear() { 
            playSound('tap');
            currentInput = ""; 
            updateDisplay(); 
        }
        function tapDelete() { 
            playSound('tap');
            currentInput = currentInput.slice(0,-1); 
            updateDisplay(); 
        }

        function updateDisplay() {
            document.getElementById('matriculeDisplay').value = currentInput || "--- --- ---";
            clearTimeout(lookupTimer);
            if (currentInput.length >= 1) {
                lookupTimer = setTimeout(triggerEmployeeLookup, 250);
            } else {
                hideEmployeeCard();
            }
        }

        async function triggerEmployeeLookup() {
            const val = currentInput.trim();
            if (!val) return hideEmployeeCard();

            const endpoints = [
                '/api/public/attendance/lookup/' + val,
                window.location.origin + '/api/public/attendance/lookup/' + val,
                'http://localhost:3000/api/public/attendance/lookup/' + val,
                'http://127.0.0.1:3000/api/public/attendance/lookup/' + val
            ];

            for (let url of endpoints) {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.found) {
                            showEmployeeCard(data);
                            return;
                        }
                    }
                } catch(e) {}
            }
            hideEmployeeCard();
        }

        function showEmployeeCard(emp) {
            const card = document.getElementById('empPreviewCard');
            const avatar = document.getElementById('empAvatar');
            const name = document.getElementById('empName');
            const role = document.getElementById('empRole');
            const badge = document.getElementById('empStatusBadge');

            const initials = `${emp.nom ? emp.nom[0] : ''}${emp.prenoms ? emp.prenoms[0] : ''}`.toUpperCase() || 'EMP';
            avatar.innerText = initials;
            name.innerText = `${emp.nom} ${emp.prenoms}`;
            role.innerText = `${emp.poste} • ${emp.departement}`;

            if (emp.hasOutToday) {
                badge.className = 'text-[9px] font-black uppercase px-3 py-1.5 rounded-xl bg-orange-100 text-ci-orange';
                badge.innerText = `Sortie à ${emp.outTime}`;
            } else if (emp.hasInToday) {
                badge.className = 'text-[9px] font-black uppercase px-3 py-1.5 rounded-xl bg-emerald-100 text-ci-green';
                badge.innerText = `Arrivée à ${emp.inTime}`;
            } else {
                badge.className = 'text-[9px] font-black uppercase px-3 py-1.5 rounded-xl bg-slate-200 text-slate-700';
                badge.innerText = 'Prêt à pointer';
            }

            card.classList.remove('hidden');
        }

        function hideEmployeeCard() {
            const card = document.getElementById('empPreviewCard');
            card.classList.add('hidden');
        }

        async function fetchLiveTicker() {
            const endpoints = [
                '/api/public/attendance/ticker',
                window.location.origin + '/api/public/attendance/ticker',
                'http://localhost:3000/api/public/attendance/ticker',
                'http://127.0.0.1:3000/api/public/attendance/ticker'
            ];
            for (let url of endpoints) {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        const rows = await res.json();
                        if (rows && rows.length > 0) {
                            const formatted = rows.map(r => {
                                const time = new Date(r.timestamp).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                                const typeLabel = r.type === 'IN' ? 'Entrée' : 'Sortie';
                                return `${r.nom} (${typeLabel} à ${time})`;
                            }).join('   •   ');
                            document.getElementById('liveTickerText').innerText = formatted;
                        } else {
                            document.getElementById('liveTickerText').innerText = 'Aucun pointage enregistré aujourd\'hui.';
                        }
                        return;
                    }
                } catch(e) {}
            }
        }
        setInterval(fetchLiveTicker, 5000);
        fetchLiveTicker();

        function showOverlay(type, title, message, actionText, duration = 3500) {
            playSound(type);
            const overlay = document.getElementById('kioskOverlay');
            const icon = document.getElementById('overlayIcon');
            const titleEl = document.getElementById('overlayTitle');
            const nameEl = document.getElementById('userNameLabel');
            const actionEl = document.getElementById('actionLabel');

            titleEl.innerText = title;
            nameEl.innerText = message;
            actionEl.innerText = actionText || (type === 'success' ? 'VALIDÉ' : 'ATTENTION');

            if (type === 'success') {
                overlay.className = 'absolute inset-0 z-50 rounded-[40px] flex flex-col items-center justify-center text-white p-8 text-center transition-all duration-300 bg-ci-green';
                icon.setAttribute('data-lucide', 'check');
            } else if (type === 'warning') {
                overlay.className = 'absolute inset-0 z-50 rounded-[40px] flex flex-col items-center justify-center text-white p-8 text-center transition-all duration-300 bg-amber-600';
                icon.setAttribute('data-lucide', 'alert-triangle');
            } else {
                overlay.className = 'absolute inset-0 z-50 rounded-[40px] flex flex-col items-center justify-center text-white p-8 text-center transition-all duration-300 bg-rose-600';
                icon.setAttribute('data-lucide', 'alert-circle');
            }
            lucide.createIcons();

            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.add('hidden');
                tapClear();
                fetchLiveTicker();
            }, duration);
        }

        async function processPointage(type) {
            if (isProcessing) return;
            const val = currentInput.trim();
            if (!val) {
                showOverlay('warning', 'SAISIE MANQUANTE', 'Veuillez saisir votre numéro de matricule (ex: 001 ou 002).', 'SAISIE OBLIGATOIRE', 3000);
                return;
            }

            isProcessing = true;
            let response = null;
            const payload = JSON.stringify({
                matricule: val,
                type: type,
                site: 'Abidjan Plateau'
            });

            const endpoints = [
                '/api/public/attendance/terminal',
                window.location.origin + '/api/public/attendance/terminal',
                'http://localhost:3000/api/public/attendance/terminal',
                'http://127.0.0.1:3000/api/public/attendance/terminal'
            ];

            for (let url of endpoints) {
                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: payload
                    });
                    if (res.ok || res.status === 404 || res.status === 400 || res.status === 500) {
                        response = res;
                        break;
                    }
                } catch (err) {}
            }

            isProcessing = false;

            if (!response) {
                showOverlay('error', 'ERREUR SERVEUR', 'Erreur de connexion au serveur SIRH-CIV. Veuillez vérifier le serveur Express.', 'CONNEXION ÉCHOUÉE', 4000);
                return;
            }

            let data = {};
            try {
                data = await response.json();
            } catch(e) {
                showOverlay('error', 'ERREUR SERVEUR', 'Réponse invalide du serveur SIRH-CIV.', 'FORMAT INVALIDE', 4000);
                return;
            }

            if (!response.ok) {
                showOverlay('error', 'POINTAGE REFUSÉ', data.error || 'Matricule non reconnu !', 'INVALIDE', 4000);
                return;
            }

            showOverlay('success', 'POINTAGE VALIDÉ !', data.employeeName, type === 'IN' ? 'Entrée enregistrée' : 'Départ enregistré', 3500);
        }

        lucide.createIcons();
    </script>
</body>
</html>
